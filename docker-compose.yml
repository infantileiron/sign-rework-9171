name: sign-rework

x-python: &python
  build: ./backend
  environment:
    POSTGRES_USER: sign
    POSTGRES_DB: sign
    POSTGRES_PASSWORD: ${DB_PASSWORD:-sign_local_demo}
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-sign-local-development-key-change-before-deploy}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sign-rework}-db
    environment:
      POSTGRES_USER: sign
      POSTGRES_DB: sign
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sign_local_demo}
    ports: ["127.0.0.1:${DB_PORT:-17778}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atc "SELECT 1"']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sign-rework}-redis
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-sign-rework}-backend
    ports: ["127.0.0.1:${BACKEND_PORT:-19278}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 25
  worker:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-sign-rework}-worker
    command: [python, -m, src.worker]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<20"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-sign-rework}-frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-18278}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
  redisdata:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.221.209.0/24}
