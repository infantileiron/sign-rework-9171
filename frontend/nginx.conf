server {
    listen 80;
    root /usr/share/nginx/html;
    location = /healthz {
        proxy_pass http://backend:8000/health;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /src/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
